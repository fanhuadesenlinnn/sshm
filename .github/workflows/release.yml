name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Unix installer
        run: |
          sh -n scripts/install.sh
          shellcheck scripts/install.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Coverage
        run: go test -cover ./...

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: ubuntu-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest
          - os: windows
            arch: arm64
            runner: ubuntu-latest
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build
        shell: bash
        run: |
          BINARY="sshmd"
          BUILD_ARGS=()
          if [ "$GOOS" = "windows" ]; then
            BINARY="sshmd.exe"
          fi
          if [ "$GOOS" = "linux" ]; then
            export CGO_ENABLED=0
            BUILD_ARGS=(-tags "netgo osusergo")
          fi
          go build "${BUILD_ARGS[@]}" \
            -ldflags="-s -w -X github.com/fanhuadesenlinnn/sshmd/v6/internal/command.Version=${{ github.ref_name }}" \
            -o "${BINARY}" .

      - name: Verify version
        shell: bash
        run: |
          BINARY="sshmd"
          if [ "$GOOS" = "windows" ]; then BINARY="sshmd.exe"; fi
          go version -m "$BINARY" | tee version.txt
          grep -F "github.com/fanhuadesenlinnn/sshmd/v6" version.txt
          grep -aF "${{ github.ref_name }}" "$BINARY" >/dev/null
          if [ "$(go env GOHOSTOS)" = "$GOOS" ] && [ "$(go env GOHOSTARCH)" = "$GOARCH" ]; then
            "./$BINARY" --version | tee version-output.txt
            grep -Fx "sshmd ${{ github.ref_name }}" version-output.txt
          fi

      - name: Verify Linux binary is static
        if: matrix.os == 'linux'
        shell: bash
        run: |
          file sshmd | tee file.txt
          grep -F "statically linked" file.txt
          go version -m sshmd | tee build-info.txt
          grep -F "CGO_ENABLED=0" build-info.txt
          if readelf -l sshmd | grep -F "Requesting program interpreter"; then
            echo "ERROR: Linux binary has a dynamic program interpreter"
            exit 1
          fi

      - name: Test Linux binary on glibc and musl
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        shell: bash
        run: |
          docker run --rm -v "$PWD/sshmd:/sshmd:ro" centos:7 /sshmd --version
          docker run --rm -v "$PWD/sshmd:/sshmd:ro" alpine:3.19 /sshmd --version

      - name: Package (Linux / macOS)
        if: matrix.os != 'windows'
        run: |
          tar -czf "sshmd_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" sshmd

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          if command -v zip >/dev/null 2>&1; then
            zip "sshmd_windows_${{ matrix.arch }}.zip" sshmd.exe
          else
            powershell.exe -Command "Compress-Archive -Path sshmd.exe -DestinationPath 'sshmd_windows_${{ matrix.arch }}.zip'"
          fi

      - name: Validate artifact exists
        shell: bash
        run: |
          if [ "$GOOS" = "windows" ]; then
            ARTIFACT="sshmd_windows_${GOARCH}.zip"
          else
            ARTIFACT="sshmd_${GOOS}_${GOARCH}.tar.gz"
          fi
          if [ ! -f "$ARTIFACT" ]; then
            echo "ERROR: Artifact $ARTIFACT was not created"
            exit 1
          fi
          echo "Artifact $ARTIFACT created ($(wc -c < "$ARTIFACT") bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sshmd-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            sshmd_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
            sshmd_windows_${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Validate all platforms present
        run: |
          EXPECTED=(
            "sshmd_linux_amd64.tar.gz"
            "sshmd_linux_arm64.tar.gz"
            "sshmd_darwin_amd64.tar.gz"
            "sshmd_darwin_arm64.tar.gz"
            "sshmd_windows_amd64.zip"
            "sshmd_windows_arm64.zip"
          )
          MISSING=()
          for f in "${EXPECTED[@]}"; do
            if [ ! -f "artifacts/$f" ]; then
              MISSING+=("$f")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "ERROR: Missing artifacts: ${MISSING[*]}"
            exit 1
          fi
          echo "All 6 platform artifacts present"
          ls -la artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Prepare release body
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES" ]; then
            cat "$NOTES" > release-body.md
          else
            printf '## sshmd %s\n\n' "$TAG" > release-body.md
          fi
          cat >> release-body.md <<'EOF'

          ## 支持平台

          | 文件 | 平台 |
          |------|------|
          | `sshmd_linux_amd64.tar.gz` | Linux x86_64 |
          | `sshmd_linux_arm64.tar.gz` | Linux ARM64 |
          | `sshmd_darwin_amd64.tar.gz` | macOS Intel |
          | `sshmd_darwin_arm64.tar.gz` | macOS Apple Silicon |
          | `sshmd_windows_amd64.zip` | Windows x86_64 |
          | `sshmd_windows_arm64.zip` | Windows ARM64 |

          Linux 制品为纯 Go 静态二进制，不依赖目标系统的 glibc，可直接运行于 glibc 或 musl 环境。

          ## 安装

          ```bash
          # macOS / Linux
          curl -fsSL https://raw.githubusercontent.com/fanhuadesenlinnn/sshmd/main/scripts/install.sh | sh
          ```

          ```powershell
          # Windows PowerShell
          irm https://raw.githubusercontent.com/fanhuadesenlinnn/sshmd/main/scripts/install.ps1 | iex
          ```

          安装脚本保存在代码仓库中，不作为 Release 附件；安装时会自动选择平台制品并使用本页的 `checksums.txt` 校验 SHA-256。
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: artifacts/*
