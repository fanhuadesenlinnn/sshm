name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          # macOS
          - os: darwin
            arch: amd64
            runner: macos-13
          - os: darwin
            arch: arm64
            runner: macos-latest
          # Windows
          - os: windows
            arch: amd64
            runner: windows-latest
          - os: windows
            arch: arm64
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOTOOLCHAIN: auto
        run: |
          BINARY="sshm"
          if [ "$GOOS" = "windows" ]; then
            BINARY="sshm.exe"
          fi
          go build -ldflags="-s -w" -o "${BINARY}" .

      - name: Package (Linux / macOS)
        if: matrix.os != 'windows'
        run: |
          tar -czf "sshm_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" sshm

      - name: Package (Windows)
        if: matrix.os == 'windows'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell Compress-Archive -Path sshm.exe -DestinationPath "sshm_windows_${{ matrix.arch }}.zip"
          else
            zip "sshm_windows_${{ matrix.arch }}.zip" sshm.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshm-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            sshm_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
            sshm_windows_${{ matrix.arch }}.zip
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## sshm ${{ github.ref_name }}

            ### 支持平台

            | 文件 | 平台 |
            |------|------|
            | `sshm_linux_amd64.tar.gz` | Linux x86_64 |
            | `sshm_linux_arm64.tar.gz` | Linux ARM64 |
            | `sshm_darwin_amd64.tar.gz` | macOS Intel |
            | `sshm_darwin_arm64.tar.gz` | macOS Apple Silicon |
            | `sshm_windows_amd64.zip` | Windows x86_64 |
            | `sshm_windows_arm64.zip` | Windows ARM64 |

            ### 安装

            ```bash
            # macOS / Linux
            tar -xzf sshm_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m).tar.gz
            sudo mv sshm /usr/local/bin/
            ```
          files: artifacts/*
          generate_release_notes: true
