name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Coverage
        run: go test -cover ./...

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: ubuntu-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest
          - os: windows
            arch: arm64
            runner: ubuntu-latest
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build
        shell: bash
        run: |
          BINARY="sshm"
          if [ "$GOOS" = "windows" ]; then
            BINARY="sshm.exe"
          fi
          go build -ldflags="-s -w -X github.com/fanhuadesenlinnn/sshm/internal/command.Version=${{ github.ref_name }}" -o "${BINARY}" .

      - name: Verify version
        shell: bash
        run: |
          BINARY="sshm"
          if [ "$GOOS" = "windows" ]; then BINARY="sshm.exe"; fi
          go version -m "$BINARY" | tee version.txt
          grep -F "github.com/fanhuadesenlinnn/sshm/internal/command.Version=${{ github.ref_name }}" version.txt

      - name: Package (Linux / macOS)
        if: matrix.os != 'windows'
        run: |
          tar -czf "sshm_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" sshm

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          if command -v zip >/dev/null 2>&1; then
            zip "sshm_windows_${{ matrix.arch }}.zip" sshm.exe
          else
            powershell.exe -Command "Compress-Archive -Path sshm.exe -DestinationPath 'sshm_windows_${{ matrix.arch }}.zip'"
          fi

      - name: Validate artifact exists
        shell: bash
        run: |
          if [ "$GOOS" = "windows" ]; then
            ARTIFACT="sshm_windows_${GOARCH}.zip"
          else
            ARTIFACT="sshm_${GOOS}_${GOARCH}.tar.gz"
          fi
          if [ ! -f "$ARTIFACT" ]; then
            echo "ERROR: Artifact $ARTIFACT was not created"
            exit 1
          fi
          echo "Artifact $ARTIFACT created ($(wc -c < "$ARTIFACT") bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sshm-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            sshm_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
            sshm_windows_${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Validate all platforms present
        run: |
          EXPECTED=(
            "sshm_linux_amd64.tar.gz"
            "sshm_linux_arm64.tar.gz"
            "sshm_darwin_amd64.tar.gz"
            "sshm_darwin_arm64.tar.gz"
            "sshm_windows_amd64.zip"
            "sshm_windows_arm64.zip"
          )
          MISSING=()
          for f in "${EXPECTED[@]}"; do
            if [ ! -f "artifacts/$f" ]; then
              MISSING+=("$f")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "ERROR: Missing artifacts: ${MISSING[*]}"
            exit 1
          fi
          echo "All 6 platform artifacts present"
          ls -la artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: |
            ## sshm ${{ github.ref_name }}

            ### 支持平台

            | 文件 | 平台 |
            |------|------|
            | `sshm_linux_amd64.tar.gz` | Linux x86_64 |
            | `sshm_linux_arm64.tar.gz` | Linux ARM64 |
            | `sshm_darwin_amd64.tar.gz` | macOS Intel |
            | `sshm_darwin_arm64.tar.gz` | macOS Apple Silicon |
            | `sshm_windows_amd64.zip` | Windows x86_64 |
            | `sshm_windows_arm64.zip` | Windows ARM64 |

            ### 安装

            ```bash
            # macOS / Linux
            tar -xzf sshm_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m).tar.gz
            sudo mv sshm /usr/local/bin/
            ```
          files: artifacts/*
          generate_release_notes: true
