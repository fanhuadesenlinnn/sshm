name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Unix installer
        run: |
          sh -n scripts/install.sh
          shellcheck scripts/install.sh

      - name: Test Unix installer
        run: |
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo latest)"
          scripts/install.sh --version "$VERSION" --install-dir "$RUNNER_TEMP/sshmd-bin"
          "$RUNNER_TEMP/sshmd-bin/sshmd" --version | grep -Fx "sshmd $VERSION"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Coverage
        run: go test -cover ./...

  linux-static:
    name: Linux static compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build static Linux binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -tags "netgo osusergo" -o sshmd-linux-static .

      - name: Verify static linking
        run: |
          file sshmd-linux-static | tee file.txt
          grep -F "statically linked" file.txt
          go version -m sshmd-linux-static | tee build-info.txt
          grep -F "CGO_ENABLED=0" build-info.txt
          if readelf -l sshmd-linux-static | grep -F "Requesting program interpreter"; then
            echo "ERROR: Linux binary has a dynamic program interpreter"
            exit 1
          fi

      - name: Test glibc and musl environments
        run: |
          docker run --rm -v "$PWD/sshmd-linux-static:/sshmd:ro" centos:7 /sshmd --version
          docker run --rm -v "$PWD/sshmd-linux-static:/sshmd:ro" alpine:3.19 /sshmd --version

  cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test PowerShell installer
        shell: powershell
        run: |
          $Version = git describe --tags --abbrev=0
          if ($LASTEXITCODE -ne 0) { $Version = 'latest' }
          $InstallDir = Join-Path $env:RUNNER_TEMP 'sshmd-bin'
          & .\scripts\install.ps1 -Version $Version -InstallDir $InstallDir -NoPathUpdate
          $Output = & (Join-Path $InstallDir 'sshmd.exe') --version
          if ($Output -ne "sshmd $Version") {
            throw "Unexpected version output: $Output"
          }
